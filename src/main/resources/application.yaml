spring:
  profiles:
    default: local
  application:
    name: recommend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/natural_taste}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:local-development-secret-local-development-secret}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

app:
  image:
    local:
      upload-dir: ${IMAGE_LOCAL_UPLOAD_DIR:uploads/images}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
