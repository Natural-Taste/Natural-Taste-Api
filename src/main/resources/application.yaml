spring:
  application:
    name: recommend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/natural_taste}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:local-development-secret-local-development-secret}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
